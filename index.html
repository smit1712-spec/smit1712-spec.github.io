<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMIT // SEC-OS</title>

    <meta
        name="description"
        content="Smit Borkhetaria — Cybersecurity Portfolio"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         BOOT SCREEN
    ================================= -->

    <div id="boot-screen">

        <div class="boot-container">

            <div class="boot-header">
                <span>SMIT // SEC-OS</span>
                <span class="secure-status">
                    ● SECURE
                </span>
            </div>

            <div class="boot-content">

                <div class="boot-label">
                    SECURITY OPERATING ENVIRONMENT
                </div>

                <h1>
                    INITIALIZING
                    <span>SECURITY OS</span>
                </h1>

                <div class="progress-container">

                    <div class="progress-bar">
                        <div id="progress"></div>
                    </div>

                    <div class="progress-info">
                        <span id="progress-text">0%</span>
                        <span>BOOT SEQUENCE</span>
                    </div>

                </div>

                <div id="boot-log" class="boot-log">

                    <div>
                        <span>›</span>
                        Initializing kernel...
                    </div>

                </div>

                <div id="access-message" class="access-message">

                    <div class="access-icon">✓</div>

                    <div>
                        <strong>ACCESS GRANTED</strong>
                        <span>SECURE ENVIRONMENT READY</span>
                    </div>

                </div>

                <button id="enter-system">
                    ENTER SYSTEM
                    <span>→</span>
                </button>

            </div>

            <div class="boot-footer">

                <span>SECURITY LEVEL: ALPHA</span>

                <span>
                    SYSTEM ID:
                    <strong>SMIT-SEC-01</strong>
                </span>

            </div>

        </div>

    </div>


    <!-- ================================
         MAIN SYSTEM
    ================================= -->

    <main id="main-system">

        <h1>SMIT // SECURITY OPERATIONS</h1>

        <p>
            System initialized.
            Command center loading...
        </p>

    </main>


    <script src="script.js"></script>

</body>
</html>
